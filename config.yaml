# BEVFormerRadar — 단일 하이퍼파라미터 소스

data:
  dataroot: "../fmcw-radar-sensor/data/v1.0-mini"
  version: "v1.0-mini"
  train_scenes: [0, 1, 2, 3, 4, 5]   # scene indices
  val_scenes:   [6, 7]

  img_h: 448
  img_w: 800
  img_mean: [0.485, 0.456, 0.406]     # ImageNet stats
  img_std:  [0.229, 0.224, 0.225]

  # Camera channels (nuScenes)
  cam_channels:
    - CAM_FRONT
    - CAM_FRONT_LEFT
    - CAM_FRONT_RIGHT
    - CAM_BACK
    - CAM_BACK_LEFT
    - CAM_BACK_RIGHT

  # Radar channels (nuScenes)
  radar_channels:
    - RADAR_FRONT
    - RADAR_FRONT_LEFT
    - RADAR_FRONT_RIGHT
    - RADAR_BACK_LEFT
    - RADAR_BACK_RIGHT

  max_radar_range: 50.0   # [m] ego frame
  temporal_frames: 2      # T=2: current + 1 previous

# BEV grid (PointPainting 규약과 일치)
bev:
  x_min: -50.0
  x_max:  50.0
  y_min: -50.0
  y_max:  50.0
  cell_size: 0.5          # [m/cell]
  h: 200                  # y방향 셀 수
  w: 200                  # x방향 셀 수

  # 3D reference point z 앵커 (SCA용)
  z_anchors: [0.0]        # [m] ego frame, 지면 평면

# 클래스 정의 (nuScenes → 3 superclass)
classes:
  vehicle:
    - vehicle.car
    - vehicle.truck
    - vehicle.bus.bendy
    - vehicle.bus.rigid
    - vehicle.construction
    - vehicle.trailer
  pedestrian:
    - human.pedestrian.adult
    - human.pedestrian.child
    - human.pedestrian.wheelchair
    - human.pedestrian.stroller
  cyclist:
    - vehicle.motorcycle
    - vehicle.bicycle

model:
  # Backbone
  backbone: resnet50
  backbone_frozen: true
  pretrained: true

  # FPN
  fpn_out_channels: 256
  fpn_levels: [2, 3, 4]   # layer2=C3, layer3=C4, layer4=C5

  # BEV Encoder
  bev_channels: 256
  num_encoder_layers: 2
  num_heads: 8
  ffn_hidden_dim: 1024
  dropout: 0.1

  # SCA
  sca_chunk_size: 5000    # BEV 쿼리 청크 (메모리 최적화)

  # Detection head
  num_classes: 3
  heatmap_sigma_factor: 2.0  # GT 박스 크기 대비 Gaussian sigma 비율

train:
  epochs: 30
  batch_size: 1             # nuScenes mini에서 메모리 최적화
  lr: 2.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  grad_clip_norm: 1.0
  checkpoint_interval: 5
  num_workers: 0            # Windows 멀티프로세싱 이슈 방지

  # Loss weights
  loss_heatmap_weight: 1.0
  loss_offset_weight: 0.25
  loss_size_weight: 0.25
  loss_yaw_weight: 0.25

  # Radar fusion
  use_radar_fusion: true

eval:
  nms_radius: 2.0          # [m] center-distance NMS
  score_threshold: 0.0001   # mini dataset 30ep → low confidence
  match_threshold: 2.0     # [m] MOT match threshold
